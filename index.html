<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>米哈游资讯</title>
<meta name="description" content="崩坏3 · 原神 · 星穹铁道 · 绝区零的版本更新日历、前瞻直播倒计时与官方视频库。">
<meta name="theme-color" content="#080a0f">
<link rel="icon" type="image/png" href="assets/icons/HoYoverse.png">
<script>
// 主题在解析 body 前注入，避免 FOUC。hoyo-theme = "dark"|"light"（手动选择）| 无（跟随系统）
// 关键：无论手动还是自动，都必须设置 data-theme，否则全站 CSS 变量失效导致布局散乱
(function () {
  var t = localStorage.getItem("hoyo-theme");
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root { --ease: cubic-bezier(.22, 1, .36, 1); }
html[data-theme="dark"] {
  color-scheme: dark; --bg: #080a0f; --card: rgba(20, 23, 32, .78); --card-solid: #141720;
  --surface: rgba(255, 255, 255, .04); --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .15);
  --text: #f0f3fa; --text-2: #9ba3b4; --text-3: #636b7e; --track: rgba(255, 255, 255, .09);
  --shadow: 0 12px 36px -12px rgba(0, 0, 0, .65); --shadow-hover: 0 20px 48px -12px rgba(0, 0, 0, .85);
  --urgent: #fb7185; --glow-op: .42;
}
html[data-theme="light"] {
  color-scheme: light; --bg: #f2f4f8; --card: rgba(255, 255, 255, .85); --card-solid: #ffffff;
  --surface: rgba(15, 23, 42, .035); --border: rgba(15, 23, 42, .08); --border-strong: rgba(15, 23, 42, .15);
  --text: #121621; --text-2: #586174; --text-3: #8c95a6; --track: rgba(15, 23, 42, .09);
  --shadow: 0 10px 30px -12px rgba(20, 30, 50, .12); --shadow-hover: 0 20px 44px -12px rgba(20, 30, 50, .2);
  --urgent: #e11d48; --glow-op: .28;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; overflow-x: hidden;
  transition: background .4s var(--ease), color .4s var(--ease);
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
a { color: inherit; text-decoration: none; }

/* 全局细滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

/* 背景氛围光晕 */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(95px); opacity: var(--glow-op); animation: drift 28s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 50vmax; height: 50vmax; left: -16vmax; top: -20vmax; background: radial-gradient(circle, rgba(124, 91, 214, .35), transparent 65%); }
.aurora i:nth-child(2) { width: 45vmax; height: 45vmax; right: -14vmax; top: -6vmax; background: radial-gradient(circle, rgba(217, 161, 44, .28), transparent 65%); animation-delay: -9s; }
.aurora i:nth-child(3) { width: 48vmax; height: 48vmax; left: 25vw; bottom: -24vmax; background: radial-gradient(circle, rgba(239, 122, 69, .24), transparent 65%); animation-delay: -18s; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(3vmax, 2vmax, 0) scale(1.08); } }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 48px; animation: pageIn .5s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 顶栏 */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
.logo { width: 40px; height: 40px; border-radius: 12px; flex: none; overflow: hidden; box-shadow: 0 8px 20px -6px rgba(139, 92, 246, .45); }
.logo img { width: 100%; height: 100%; display: block; object-fit: contain; }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: .3px; }
.brand p { font-size: .74rem; color: var(--text-3); letter-spacing: .08em; margin-top: 1px; }

.search { position: relative; flex: 1; max-width: 280px; min-width: 180px; }
.search input {
  width: 100%; height: 38px; padding: 0 30px 0 34px; border: 1px solid var(--border-strong); border-radius: 10px;
  background: var(--card); color: var(--text); font-size: .84rem; outline: none; backdrop-filter: blur(12px); transition: border-color .2s;
}
.search input:focus { border-color: var(--text-2); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-3); }
.qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
  border: none; border-radius: 50%; background: var(--surface); color: var(--text-3); font-size: .68rem;
  cursor: pointer; display: none; align-items: center; justify-content: center; transition: all .15s;
}
.qclear.show { display: flex; }
.qclear:hover { color: var(--text); background: var(--border-strong); }

.icon-btn, .mclose {
  border: 1px solid var(--border-strong); background: var(--card); color: var(--text-2); cursor: pointer;
  display: grid; place-items: center; transition: all .2s var(--ease);
}
.icon-btn { width: 38px; height: 38px; flex: none; border-radius: 10px; backdrop-filter: blur(12px); }
.icon-btn:hover, .mclose:hover { color: var(--text); border-color: var(--text-2); }
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn:disabled { opacity: .45; cursor: default; transform: none; }
.icon-btn svg { width: 17px; height: 17px; }
html[data-theme="dark"] .ico-sun { display: block; } html[data-theme="dark"] .ico-moon { display: none; }
html[data-theme="light"] .ico-sun { display: none; } html[data-theme="light"] .ico-moon { display: block; }

/* 版本日历：全部游戏按下次更新时间排序，最近的做焦点卡（带秒级倒计时），其余排紧凑行；
   新增游戏无需改布局代码，flex 弹性排布天然兼容手机与桌面 */
#verlist { display: flex; flex-direction: column; gap: 12px; }

.feat {
  position: relative; overflow: hidden; border: 1px solid var(--border); background: var(--card);
  border-radius: 20px; padding: clamp(18px, 2.8vw, 24px) clamp(20px, 3.6vw, 30px);
  box-shadow: var(--shadow); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap;
}
.feat::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(80% 140% at 0% 0%, color-mix(in srgb, var(--g, #8b5cf6) 14%, transparent), transparent 70%);
  pointer-events: none;
}
.feat.is-urgent { border-color: color-mix(in srgb, var(--urgent) 40%, transparent); }
.feat-main { position: relative; min-width: 0; }
.feat-eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .16em; color: var(--g); text-transform: uppercase; margin-bottom: 8px; }
.feat-title { font-size: clamp(1.3rem, 2.8vw, 1.9rem); font-weight: 800; line-height: 1.25; }
.feat-title span { color: var(--g); }
.feat-sub { margin-top: 8px; font-size: .84rem; color: var(--text-2); }
.feat-bar { margin-top: 14px; max-width: 420px; }
.feat-meta { margin-top: 12px; font-size: .78rem; color: var(--text-3); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.feat-meta b { font-weight: 650; }
.feat-meta b.up { color: var(--g); }
.feat-meta b.done { color: var(--text-3); text-decoration: line-through; font-weight: 500; }
.feat-meta b.mute { color: var(--text-3); font-weight: 500; }
.feat-meta a { color: var(--text-2); font-weight: 650; }
.feat-meta a:hover { color: var(--g); }
.feat-clock { position: relative; display: flex; align-items: flex-end; gap: clamp(8px, 1.4vw, 14px); padding: 14px 20px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); }
.feat-clock .cell { display: flex; flex-direction: column; align-items: center; min-width: 46px; }
.feat-clock b { font-size: clamp(1.8rem, 3.4vw, 2.6rem); font-weight: 800; line-height: 1; }
.feat.is-urgent .feat-clock b { color: var(--urgent); }
.feat-clock span { font-size: .68rem; letter-spacing: .1em; color: var(--text-3); margin-top: 6px; }
.feat-clock i { font-style: normal; font-size: 1.5rem; color: var(--text-3); padding-bottom: 16px; }

.sec { margin-bottom: 36px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.sec-head h2::before { content: ""; width: 3.5px; height: 15px; border-radius: 2px; background: linear-gradient(180deg, #8b5cf6, #ec4899); }

/* 进度条（焦点卡与行共用） */
.bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--g2), var(--g)); transition: width .8s var(--ease); }
.feat.is-urgent .bar i { background: linear-gradient(90deg, var(--g), var(--urgent)); }

/* 日历行：游戏名/版本/日期/前瞻/剩余天数/进度，flex 换行，窄屏自动折行不破版 */
.vrow {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 18px; box-shadow: var(--shadow); backdrop-filter: blur(16px);
  transition: border-color .2s;
}
/* 行本身是纯信息，不做“可点击”的悬停暗示；只有“新闻 →”标签是链接 */
.vrow:hover { border-color: var(--border-strong); }
.g-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 8px var(--g); flex: none; }
.rname { font-weight: 800; font-size: .92rem; }
.rver { color: var(--text-2); font-size: .8rem; }
.rdate { color: var(--text-3); font-size: .78rem; }
.rpv { font-size: .74rem; }
.rpv.up { color: var(--g); font-weight: 650; }
.rpv.done { color: var(--text-3); text-decoration: line-through; }
.rpv.mute { color: var(--text-3); }
.rdays { margin-left: auto; font-weight: 800; font-size: .88rem; color: var(--text-2); flex: none; }
.rbar { flex: 1 1 90px; min-width: 70px; height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
.rbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--g2), var(--g)); }
.rnews { font-size: .76rem; color: var(--text-3); flex: none; text-decoration: none; padding: 8px 4px; margin: -8px -4px; transition: color .2s; }
.vrow:hover .rnews { color: var(--g); }
.vrow.urgent { border-color: color-mix(in srgb, var(--urgent) 40%, transparent); }
.vrow.urgent .rdays { color: var(--urgent); }
.vrow.urgent .rbar i { background: linear-gradient(90deg, var(--g), var(--urgent)); }

/* 官方视频库 */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
  color: var(--text-2); font-size: .78rem; font-weight: 600; font-family: inherit; cursor: pointer; user-select: none; transition: all .18s;
}
.tab:hover { color: var(--text); border-color: var(--border-strong); }
.tab.on { color: #fff; border-color: transparent; background: var(--tc, #5b6373); }
.tab em { font-style: normal; opacity: .78; margin-left: 4px; font-size: .7rem; }
select { padding: 5px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: .78rem; font-family: inherit; cursor: pointer; outline: none; }
.note-bar { font-size: .74rem; color: var(--text-3); margin-bottom: 14px; }
.note-bar b { color: var(--text); }

.status { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: .85rem; }
.spin { width: 26px; height: 26px; margin: 0 auto 10px; border: 2.5px solid var(--border-strong); border-top-color: #8b5cf6; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }
.vcard {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
/* 悬停效果只给精确指针设备，避免触屏"粘滞悬停"（点一下卡片就卡在悬停态） */
@media (hover: hover) and (pointer: fine) {
  .vcard:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--g) 65%, transparent); box-shadow: var(--shadow-hover); }
  .vcard:hover .thumb img { transform: scale(1.04); }
}
.thumb { position: relative; aspect-ratio: 16/9; background: #07090e; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s var(--ease); }
.thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 55%, rgba(0, 0, 0, .5)); }

.play-wrap { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; }
/* YouTube 式：纯半透明深色圆 + 白三角；细白描边保证在无缩略图的深色底上依然可见 */
.play-btn {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .5); color: #fff;
  border: 1px solid rgba(255, 255, 255, .3);
  backdrop-filter: blur(6px);
  transition: transform .18s var(--ease), background-color .2s;
}
.play-btn svg { width: 28px; height: 28px; display: block; }
@media (hover: hover) and (pointer: fine) {
  .vcard:hover .play-btn { background: var(--g); border-color: transparent; transform: scale(1.06); }
}
.vcard:active .play-btn { transform: scale(.93); background: rgba(0, 0, 0, .4); }

.vtag-badge { position: absolute; top: 8px; padding: 2px 8px; border-radius: 999px; font-size: .68rem; font-weight: 700; color: #fff; z-index: 3; }
.vtag-badge.g { left: 8px; background: var(--g); }
.vtag-badge.c { right: 8px; background: rgba(0, 0, 0, .62); backdrop-filter: blur(4px); }

.vmeta { padding: 12px 14px 13px; display: flex; flex-direction: column; flex: 1; }
.vmeta .t { font-size: .85rem; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vmeta .b {
  margin-top: 6px; font-size: .74rem; color: var(--text-2); line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.vmeta .d { margin-top: auto; padding-top: 8px; font-size: .71rem; color: var(--text-3); }

.more { display: flex; justify-content: center; margin-top: 22px; }
.more button {
  padding: 9px 24px; border-radius: 10px; color: var(--text); font-size: .82rem; font-weight: 650;
  background: var(--card); border: 1px solid var(--border-strong); cursor: pointer; font-family: inherit;
}
.more button:hover { border-color: var(--text-2); background: var(--surface); }
#freset { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 40%, transparent); }
#freset:hover { color: var(--urgent); border-color: var(--urgent); }
.empty { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-3); }

/* 视频播放弹窗与简介排版 */
.modal { position: fixed; inset: 0; z-index: 99; background: rgba(0, 0, 0, .88); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.mbox {
  width: 100%; max-width: 960px; max-height: calc(100vh - 40px);
  background: var(--card-solid); border: 1px solid var(--border-strong); border-radius: 18px;
  overflow: hidden; box-shadow: 0 24px 64px rgba(0, 0, 0, .7); display: flex; flex-direction: column;
}
.mbox video { width: 100%; display: block; max-height: 56vh; background: #000; flex: none; }
.mbody { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.mhead { display: flex; align-items: flex-start; gap: 12px; }
.mhead .info { flex: 1; min-width: 0; }
.mhead .mt { font-size: 1rem; font-weight: 800; line-height: 1.4; }
.mhead .ms { font-size: .76rem; color: var(--text-3); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.mhead .ms b { color: var(--g); font-weight: 700; }
.mactions { display: flex; align-items: center; gap: 8px; flex: none; }
.mbtn { padding: 7px 14px; border-radius: 9px; font-size: .78rem; font-weight: 650; color: #fff; background: #5b6373; white-space: nowrap; transition: filter .2s, background-color .25s, color .25s; }
.mbtn:hover { filter: brightness(1.08); }
/* 下载中按钮变为明确的“取消下载”态，与普通按钮区分开 */
#mdown.canceling { background: var(--surface); color: var(--text-2); box-shadow: inset 0 0 0 1px var(--border-strong); }
#mdown.canceling:hover { color: var(--urgent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--urgent) 45%, transparent); }
.mclose { width: 34px; height: 34px; flex: none; border-radius: 9px; font-size: 1rem; }
/* 弹窗内上一个/下一个 */
.mnav { font-size: 1.25rem; line-height: 1; }
.mnav:disabled { opacity: .45; pointer-events: none; }

/* 下载进度条：与按钮分离，误触按钮不会丢进度 */
.dlbar { display: flex; align-items: center; gap: 10px; }
.dlbar[hidden] { display: none; }
.dlbar .dltrack { flex: 1; height: 4px; border-radius: 999px; background: var(--track); overflow: hidden; }
.dlbar .dltrack i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--g2), var(--g)); transition: width .25s linear; }
#dltext { font-size: .74rem; color: var(--text-2); white-space: nowrap; }

.mdesc-box {
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  overflow-y: auto; max-height: 185px;
}
.mdesc-box::-webkit-scrollbar { width: 5px; }
.mdesc-box::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.mdesc { font-size: .82rem; color: var(--text-2); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }

/* 手机适配 */
@media (max-width: 580px) {
  .wrap { padding: 16px 12px 36px; }
  .brand h1 { font-size: 1.08rem; }
  .logo, .icon-btn { width: 34px; height: 34px; }
  .search { order: 5; max-width: none; width: 100%; flex-basis: 100%; }
  /* iOS 聚焦字号小于 16px 的输入框会强制放大整个页面，移动端统一提到 16px */
  .search input, select { font-size: 16px; }
  .feat { padding: 16px; border-radius: 16px; gap: 16px; }
  .feat-clock { width: 100%; justify-content: space-between; padding: 12px 14px; }
  .feat-clock .cell { flex: 1; min-width: 0; }
  .vrow { padding: 11px 14px; gap: 8px; }
  .rbar { flex-basis: 100%; }
  .vgrid { grid-template-columns: 1fr; }
  .modal { padding: 10px; }
  .mbox { border-radius: 14px; }
  .mbox video { max-height: 38vh; }
  .mbody { padding: 13px 14px 14px; gap: 10px; }
  .mhead { flex-wrap: wrap; }
  .mhead .info { flex-basis: 100%; }
  .mactions { width: 100%; }
  .mbtn { flex: 1; text-align: center; }
  .mclose { width: 40px; height: 40px; } /* 触控目标 40px 起步 */
  .mdesc-box { max-height: 140px; padding: 10px 12px; }
}

/* 回到顶部 */
#toTop {
  position: fixed; right: 18px; bottom: 18px; z-index: 60; width: 40px; height: 40px; border-radius: 12px;
  border: 1px solid var(--border-strong); background: var(--card); color: var(--text-2); cursor: pointer;
  display: grid; place-items: center; opacity: 0; visibility: hidden; transform: translateY(8px);
  transition: opacity .25s var(--ease), transform .25s var(--ease), color .2s; backdrop-filter: blur(12px);
  box-shadow: var(--shadow); font-size: 1.05rem; line-height: 1;
}
#toTop.show { opacity: 1; visibility: visible; transform: none; }
#toTop:hover { color: var(--text); border-color: var(--text-2); }

/* 无障碍：用户要求减少动态时关闭动画 */

<script>
"use strict";
const DAY = 86400000, KEY = "hoyo-pv-v13", LIMIT = 24, PAGE_MAX = 300;
const WK = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const CATS = ["版本PV", "剧情PV", "千星纪游", "过场动画", "角色演示", "角色PV", "动画短片", "EP", "音乐", "前瞻", "纪念活动", "其他"];
const PLAY_ICON = `<div class="play-wrap"><div class="play-btn"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></div></div>`;

const GAMES = [
  {
    id: "bh3", name: "崩坏3", color: "#9b7ae0", color2: "#bfa6f7",

    cycle: 42, updateTime: "06:00", pvKind: "live", pvOffset: 12, pvTime: "20:00",
    notice: "https://ys.mihoyo.com/main/news",

    feeds: [{ base: "https://act-api-takumi-static.mihoyo.com/content_v2_user/app/1963de8dc19e461c/getContentList", chans: [255], detail: "https://sr.mihoyo.com/news/" }]

  }
];

const byId = Object.fromEntries(GAMES.map(g => [g.id, g]));
const FEEDS = GAMES.flatMap(g => (g.feeds || []).map(f => ({ ...f, game: g.id })));

const $ = s => document.querySelector(s);
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const at = (d, t = "06:00") => new Date(`${d}T${t}:00+08:00`);
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const fmtFull = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtShort = d => `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const bump = v => { const [a, b] = v.split(".").map(Number); return b < 9 ? `${a}.${b + 1}` : `${a + 1}.0`; };
const first = v => !v ? "" : typeof v === "string" ? (v.startsWith("http") ? v.replace(/^http:\/\//i, "https://") : "") : Array.isArray(v) ? first(v[0]) : typeof v === "object" ? first(v.url) : "";
const parse = s => { if (!s || typeof s === "object") return s || {}; try { return JSON.parse(s); } catch { return {}; } };

// 主题：localStorage["hoyo-theme"] = "dark"|"light"（手动）| 无（跟随系统）
// 手动时恢复上次选择，否则跟随系统；两种情况都无条件 applyTheme，保证 data-theme 存在
const mqLight = window.matchMedia("(prefers-color-scheme: light)");
const applyTheme = t => document.documentElement.setAttribute("data-theme", t);
const syncTheme = () => {
  const s = localStorage.getItem("hoyo-theme");
  applyTheme(s === "dark" || s === "light" ? s : mqLight.matches ? "light" : "dark");
};
syncTheme();
if (mqLight.addEventListener) mqLight.addEventListener("change", syncTheme);
else mqLight.addListener(syncTheme);
window.addEventListener("pageshow", syncTheme);
$("#themeBtn").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("hoyo-theme", next);
  applyTheme(next);
};

function getTimeline(g) {
  const now = new Date();
  let start = at(g.start, g.updateTime), cur = g.cur;
  let nextDt = at(g.nextDate, g.updateTime), next = g.next, guard = 0;
  while (nextDt <= now && guard++ < 100) {
    start = nextDt; cur = next;
    nextDt = addDays(nextDt, g.cycle); next = bump(next);
  }
  const pvDt = g.pvKind === "live" ? at(fmtFull(addDays(nextDt, -g.pvOffset)), g.pvTime) : null;
  return { cur, start, next, nextDt, pvDt };
}

function renderDashboard() {
  const now = new Date(), today0 = new Date(); today0.setHours(0, 0, 0, 0);
  // 全部游戏按下次更新时间升序；最近的做焦点卡（秒级倒计时），其余排成紧凑行
  const states = GAMES.map(g => ({ g, tl: getTimeline(g) })).sort((a, b) => a.tl.nextDt - b.tl.nextDt);

  const stat = ({ g, tl }) => {
    const totalDays = Math.max(1, Math.round((tl.nextDt - tl.start) / DAY));
    const elapsedDays = Math.max(0, Math.floor((now - tl.start) / DAY));
    const remainDays = Math.max(0, Math.ceil((tl.nextDt - now) / DAY));
    const pct = Math.max(0, Math.min(100, Math.round((elapsedDays / totalDays) * 100)));
    let pvText = "不定期", pvCls = "mute";
    if (g.pvKind === "live" && tl.pvDt) {
      const diffD = Math.round((new Date(tl.pvDt.getFullYear(), tl.pvDt.getMonth(), tl.pvDt.getDate()) - today0) / DAY);
      if (tl.pvDt < now) { pvText = `${fmtShort(tl.pvDt)} 已结束`; pvCls = "done"; }
      else if (diffD === 0) { pvText = `今晚 ${g.pvTime}`; pvCls = "up"; }
      else { pvText = `${fmtShort(tl.pvDt)}（${diffD}天后）`; pvCls = "up"; }
    }
    return { totalDays, elapsedDays, remainDays, pct, pvText, pvCls, urgent: remainDays > 0 && remainDays <= 7 };
  };

  const f = states[0], ft = stat(f), tl = f.tl, after = states[1];
  const hh = String(tl.nextDt.getHours()).padStart(2, "0"), mm = String(tl.nextDt.getMinutes()).padStart(2, "0");

  $("#verlist").innerHTML = `
    <article class="feat ${ft.urgent ? "is-urgent" : ""}" style="--g:${f.g.color};--g2:${f.g.color2}">
      <div class="feat-main">
        <div class="feat-eyebrow">NEXT UP · 下一版本</div>
        <div class="feat-title">${f.g.name} <span>v${tl.next}</span> 版本更新</div>
        <div class="feat-sub num">${fmtFull(tl.nextDt)} ${WK[tl.nextDt.getDay()]} ${hh}:${mm} · 当前 v${tl.cur}</div>
        <div class="feat-bar bar"><i style="width:${ft.pct}%"></i></div>
        <div class="feat-meta">
          <span>前瞻直播 <b class="${ft.pvCls}">${ft.pvText}</b></span>
          <span class="num">进度 ${ft.pct}% · ${ft.elapsedDays}/${ft.totalDays} 天</span>
          ${after ? `<span class="num">随后 ${after.g.name} v${after.tl.next} · ${fmtShort(after.tl.nextDt)}</span>` : ""}
          <a href="${f.g.notice}" target="_blank" rel="noopener">查看游戏新闻 →</a>
        </div>
      </div>
      <div class="feat-clock num" id="heroClock" data-ts="${tl.nextDt.getTime()}">
        <div class="cell"><b class="dd">--</b><span>天</span></div><i>:</i>
        <div class="cell"><b class="hh">--</b><span>时</span></div><i>:</i>
        <div class="cell"><b class="mm">--</b><span>分</span></div><i>:</i>
        <div class="cell"><b class="ss">--</b><span>秒</span></div>
      </div>
    </article>`
    + states.slice(1).map(({ g, tl }) => {
      const s = stat({ g, tl });
      return `
    <div class="vrow ${s.urgent ? "urgent" : ""}" style="--g:${g.color};--g2:${g.color2}">
      <span class="g-dot"></span>
      <span class="rname">${g.name}</span>
      <span class="rver num">v${tl.cur} → v${tl.next}</span>
      <span class="rdate num">${fmtFull(tl.nextDt)} ${WK[tl.nextDt.getDay()]}</span>
      <span class="rpv ${s.pvCls}">前瞻 ${s.pvText}</span>
      <span class="rdays num">${s.remainDays}天</span>
      <span class="rbar"><i style="width:${s.pct}%"></i></span>
      <a class="rnews" href="${g.notice}" target="_blank" rel="noopener" title="查看${g.name}游戏新闻">新闻 →</a>
    </div>`;
    }).join("");
  tickClock();
}

function tickClock() {
  const box = $("#heroClock");
  if (!box) return;
  const left = +box.dataset.ts - Date.now();
  if (left <= 0) { renderDashboard(); return; } // 节点到点后立即刷新看板，不必等 10 分钟周期
  let diff = left;
  const d = Math.floor(diff / DAY); diff -= d * DAY;
  const h = Math.floor(diff / 3600000); diff -= h * 3600000;
  const m = Math.floor(diff / 60000); diff -= m * 60000;
  box.querySelector(".dd").textContent = d;
  box.querySelector(".hh").textContent = String(h).padStart(2, "0");
  box.querySelector(".mm").textContent = String(m).padStart(2, "0");
  box.querySelector(".ss").textContent = String(Math.floor(diff / 1000)).padStart(2, "0");
}

function classify(s, g) {
  s = s || "";
  if (g === "hsr" && s.includes("走近星穹")) return "角色演示";
  if (/前瞻特别节目|版本前瞻|前瞻直播|前瞻预告|版本预告|直播回顾/.test(s) || (/前瞻/.test(s) && !/走近星穹/.test(s))) return "前瞻";
  if (/过场动画|过场短片|CG\b/i.test(s)) return "过场动画";
  if (/千星纪游/.test(s)) return "千星纪游"; // 星铁世界观系列（翁法罗斯英雄纪、星际和平倡议等），单列方便直达
  if (/剧情\s*PV|剧情短片|剧情预告/.test(s)) return "剧情PV";
  if (s.includes("动画短片")) return "动画短片";
  if (/版本\s*PV/i.test(s)) return "版本PV";
  if (/角色演示|角色预告|角色展示/.test(s)) return "角色演示";
  if (/角色\s*PV/i.test(s)) return "角色PV";
  if (/(?:^|[^A-Za-z])EP(?![A-Za-z])/i.test(s)) return "EP";
  if (/(?:^|[^A-Za-z])MV|主题曲|印象曲|OP\b|角色曲/i.test(s)) return "音乐";
  if (/纪念|周年|生日|回顾|庆典|嘉年华|FES|活动汇总|祝福/.test(s)) return "纪念活动";
  return "其他";
}

function cover(ext, vid, g) {
  const c = g === "gi" ? first(ext["720_1"])
    : g === "hsr" ? (first(ext["news-poster"]) || first(ext["news-pic"]))
    : (first(ext["video-cover"]) || first(ext["video-inner-cover"]));
  return c || vid.poster || "";
}

function parseMedia(html, intro, ext) {
  if (!html || !html.includes(".mp4")) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const v = doc.querySelector("video");
  let src = v ? (v.getAttribute("src") || "") : "";
  let poster = v ? (v.getAttribute("poster") || "") : "";
  if (!src.includes(".mp4")) {
    const m = html.match(/<video[^>]+src="([^"]+\.mp4[^"]*)"/i);
    if (!m) return null;
    src = m[1];
    const p = html.match(/poster="([^"]+)"/i);
    poster = p ? p[1] : "";
  }
  src = src.replace(/&amp;/g, "&").replace(/^http:\/\//i, "https://");
  poster = poster.replace(/&amp;/g, "&").replace(/^http:\/\//i, "https://");

  doc.querySelectorAll("video, img, script, style").forEach(n => n.remove());
  doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
  const blocks = [...doc.querySelectorAll("p, div")].filter(el => !el.querySelector("p, div"));
  const rawLines = (blocks.length ? blocks.map(el => el.textContent) : doc.body.textContent.split(/\n+/))
    .join("\n").split(/\n+/).map(l => l.replace(/\u00a0/g, " ").trim()).filter(Boolean);

  const lines = [];
  for (const t of rawLines) {
    if (/^(?:关于《|——.+——$|▼|关注官方|前往下载)/.test(t)) break;
    lines.push(t);
  }
  const desc = lines.join("\n") || String(intro || ext["news-summary"] || "").trim();
  return { src, poster, desc };
}

const feedUrl = (f, ch, p) => `${f.base}?${f.appId ? `iAppId=${f.appId}&` : ""}iChanId=${ch}&iPageSize=${PAGE_MAX}&iPage=${p}&sLangKey=zh-cn`;

async function fetchPage(f, ch, p) {
  const d = await (await fetch(feedUrl(f, ch, p))).json();
  if (d.retcode !== 0) throw Error(`retcode ${d.retcode}`);
  const out = [];
  for (const it of d.data.list || []) {
    const ext = parse(it.sExt);
    let media = parseMedia(it.sContent, it.sIntro, ext);
    if (!media && ext["video-url"]) {
      const u = first(ext["video-url"]);
      if (u) media = { src: u, poster: "", desc: String(it.sIntro || ext["news-summary"] || "").trim() };
    }
    if (!media || !media.src) continue;
    const title = (it.sTitle || "无标题").trim(), id = it.iInfoId || "";
    out.push({
      game: f.game, title, cat: classify(title, f.game), video: media.src,
      cover: cover(ext, media, f.game), poster: media.poster,
      date: (it.dtStartTime || "").slice(0, 10), link: id ? f.detail + id : "",
      desc: media.desc
    });
  }
  return { items: out, total: d.data.iTotal || 0 };
}

async function limit(tasks, n, onDone) {
  let i = 0, done = 0; const res = new Array(tasks.length);
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) {
      const k = i++;
      try { res[k] = await tasks[k](); } catch (e) { res[k] = { error: e }; }
      onDone(++done, tasks.length);
    }
  }));
  return res;
}

const normUrl = u => { try { const p = new URL(u); return (p.origin + p.pathname).toLowerCase(); } catch { return String(u || "").split("?")[0].toLowerCase(); } };
function dedupe(a) {
  const seenUrl = new Set(), seenKey = new Set(), o = [];
  for (const x of a) {
    if (!x.video) continue;
    const uKey = normUrl(x.video), tKey = `${x.game}|${x.title.toLowerCase()}|${x.date}`;
    if (seenUrl.has(uKey) || seenKey.has(tKey)) continue;
    seenUrl.add(uKey); seenKey.add(tKey); o.push(x);
  }
  return o.sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : 0);
}

const readCache = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || "null"); return o?.items?.length ? o : null; } catch { return null; } };
// 超出 localStorage 配额时退一步去掉简介字段（占用大头）再存，避免"每次访问都全量重拉"
const writeCache = a => {
  try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), items: a })); }
  catch { try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), items: a.map(x => ({ ...x, desc: "" })) })); } catch {} }
};

let all = [], view = [], shown = 0, game = "all", cat = "all", kw = "", year = "all", sort = "desc", busy = false;
let baseNote = "";
const VMAP = new Map();

function note() { $("#note").innerHTML = baseNote + (view.length !== all.length ? ` · 当前显示 <b>${view.length}</b> 个` : ""); }

function renderLibrary() {
  $("#status").style.display = "none";
  $("#grid").style.display = "grid";
  tabs(); years(); apply();
}

async function load(force) {
  if (busy) return;
  if (!force) {
    const c = readCache();
    if (c) {
      all = dedupe(c.items.map(x => ({ ...x, cat: classify(x.title, x.game) })));
      baseNote = `已缓存 <b>${all.length}</b> 个视频 · ${new Date(c.ts).toLocaleString("zh-CN")}`;
      renderLibrary();
      refresh();
      return;
    }
  }
  busy = true; $("#refresh").disabled = true; $("#status").style.display = "block"; $("#grid").style.display = "none"; $("#more").style.display = "none";
  const jobs = FEEDS.flatMap(f => f.chans.map(ch => ({ f, ch })));
  const buckets = jobs.map(() => []);
  // 第一阶段：每个频道先拉第 1 页（每页 300 条，即最新内容），到一个频道就先渲染一个，不用等全量
  const earlyRender = () => {
    const m = dedupe(buckets.flat());
    if (!m.length) return;
    all = m;
    baseNote = `已获取 <b>${all.length}</b> 个视频，历史内容补齐中…`;
    renderLibrary();
  };
  const firstRes = await limit(jobs.map((j, i) => () => fetchPage(j.f, j.ch, 1).then(r => { buckets[i] = r.items || []; earlyRender(); return r; })), 4, (d, t) => { $("#statusText").textContent = `加载中 ${d}/${t}…`; });
  const counts = firstRes.map(r => Math.max(1, Math.ceil(((r && r.total) || 0) / PAGE_MAX)));
  const extra = []; jobs.forEach((j, i) => { for (let p = 2; p <= counts[i]; p++) extra.push({ ...j, p, i }); });
  // 第二阶段：历史分页在后台补齐，进度写在提示条，不盖住已可见的内容
  if (extra.length) await limit(extra.map(j => async () => { const r = await fetchPage(j.f, j.ch, j.p); buckets[j.i].push(...(r.items || [])); }), 5, (d, t) => { baseNote = `已显示 <b>${all.length}</b> 个视频 · 后台补齐历史 ${d}/${t}…`; note(); });
  const merged = dedupe(buckets.flat());
  busy = false; $("#refresh").disabled = false;
  if (!merged.length) { $("#statusText").textContent = "未获取到数据，请点右上角重试"; return; }
  all = merged; writeCache(all);
  // 全量补齐后重渲染；若用户已开始滚动浏览则保持原滚动位置
  const sy = window.scrollY;
  baseNote = `共 <b>${all.length}</b> 个视频`;
  renderLibrary();
  if (sy > 0) window.scrollTo({ top: sy, behavior: "auto" });
}

async function refresh() {
  if (busy) return;
  const rs = await Promise.all(FEEDS.flatMap(f => f.chans.map(ch => fetchPage(f, ch, 1).catch(() => ({ items: [] })))));
  const m = dedupe(all.concat(rs.flatMap(r => r.items)));
  if (m.length !== all.length) {
    const diff = m.length - all.length;
    all = m; writeCache(all);
    baseNote = `共 <b>${all.length}</b> 个视频${diff > 0 ? `（新增 ${diff} 个）` : ""}`;
    renderLibrary();
  }
}

function mkTabs(el, items, active, onClick) {
  el.innerHTML = items.map(i => `<button type="button" class="tab ${active === i.k ? "on" : ""}" data-k="${i.k}" aria-pressed="${active === i.k ? "true" : "false"}" style="--tc:${i.c || "#5b6373"}">${i.n}<em>${i.m}</em></button>`).join("");
  el.querySelectorAll(".tab").forEach(t => t.onclick = () => { onClick(t.dataset.k); mkTabs(el, items, t.dataset.k, onClick); });
}
function tabs() {
  const gs = GAMES.filter(g => all.some(x => x.game === g.id));
  mkTabs($("#gameTabs"), [{ k: "all", n: "全部", m: all.length, c: "#5b6373" }].concat(gs.map(g => ({ k: g.id, n: g.name, m: all.filter(x => x.game === g.id).length, c: g.color }))),
    game, k => { game = k; cat = "all"; catTabs(); apply(); });
  catTabs();
}
function catTabs() {
  const base = game === "all" ? all : all.filter(x => x.game === game);
  const accent = game === "all" ? "#8b5cf6" : byId[game].color;
  mkTabs($("#catTabs"), CATS.map(c => ({ k: c, n: c, m: base.filter(x => x.cat === c).length, c: accent })),
    cat, k => { cat = cat === k ? "all" : k; apply(); });
}
function years() {
  const y = [...new Set(all.map(x => (x.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  $("#year").innerHTML = '<option value="all">全部年份</option>' + y.map(v => `<option value="${v}"${v === year ? " selected" : ""}>${v}</option>`).join("");
}

// 任意筛选生效时显示一键重置，不必逐个清除
const activeFilters = () => game !== "all" || cat !== "all" || year !== "all" || !!kw;
$("#freset").onclick = () => {
  game = "all"; cat = "all"; year = "all"; kw = "";
  qInput.value = ""; qClear.classList.remove("show");
  $("#year").value = "all";
  tabs(); catTabs(); years(); apply();
};

function apply() {
  let l = game === "all" ? all : all.filter(x => x.game === game);
  if (cat !== "all") l = l.filter(x => x.cat === cat);
  if (year !== "all") l = l.filter(x => (x.date || "").startsWith(year));
  if (kw) {
    const k = kw.toLowerCase();
    l = l.filter(x => x.title.toLowerCase().includes(k) || (x.desc && x.desc.toLowerCase().includes(k)));
  }
  if (sort === "asc") l = [...l].reverse();
  view = l; shown = 0; VMAP.clear(); $("#grid").innerHTML = ""; more(); note();
  $("#freset").hidden = !activeFilters();
}

function more() {
  const g = $("#grid");
  if (!view.length) { g.innerHTML = `<div class="empty">${activeFilters() ? "没有匹配的视频，试试右上角「重置筛选」" : "没有匹配的视频"}</div>`; $("#more").style.display = "none"; return; }
  const s = view.slice(shown, shown + LIMIT);
  s.forEach(x => VMAP.set(x.video, x));
  g.insertAdjacentHTML("beforeend", s.map(x => {
    const gm = byId[x.game];
    return `<div class="vcard" style="--g:${gm.color}" data-v="${esc(x.video)}" tabindex="0" role="button" aria-label="播放：${esc(x.title)}">
      <div class="thumb">
        ${x.cover ? `<img src="${esc(x.cover)}" loading="lazy" alt="">` : ""}
        <span class="vtag-badge g">${esc(gm.name)}</span>
        <span class="vtag-badge c">${esc(x.cat)}</span>
        ${PLAY_ICON}
      </div>
      <div class="vmeta">
        <div class="t">${esc(x.title)}</div>
        ${x.desc ? `<div class="b">${esc(x.desc)}</div>` : ""}
        <div class="d num">${esc(x.date)}</div>
      </div>
    </div>`;
  }).join(""));
  shown += s.length;
  $("#more").style.display = shown < view.length ? "flex" : "none";
  $("#moreBtn").textContent = `加载更多（${shown} / ${view.length}）`;
}

// 弹窗内浏览：showItem 填充内容；modalList/modalIdx 记录打开时的筛选顺序，供 上一个/下一个 循环切换
let modalList = [], modalIdx = -1;
function showItem(it) {
  curItem = it;
  const gm = byId[it.game], p = $("#player");
  $("#mbox").style.setProperty("--g", gm.color);
  p.onerror = () => { // 视频源失效时不留黑屏，给出去处
    $("#mdescBox").style.display = "block";
    $("#mdesc").textContent = "视频加载失败，可尝试打开官网原文观看。";
  };
  p.pause();
  p.src = it.video; p.poster = it.poster || "";
  $("#mt").textContent = it.title;
  $("#ms").innerHTML = `<b>${esc(gm.name)}</b><span>·</span><span>${esc(it.cat)}</span><span>·</span><span class="num">${esc(it.date)}</span>`;
  $("#mlink").href = it.link || "#";
  $("#mlink").style.background = gm.color;
  if (it.desc) {
    $("#mdesc").textContent = it.desc;
    $("#mdescBox").style.display = "block";
    $("#mdescBox").scrollTop = 0;
  } else {
    $("#mdescBox").style.display = "none";
  }
  $("#modal").classList.add("show");
  dlUI(); // 同步该视频的下载状态：后台还在下 → 恢复进度显示；别的视频 → 按钮归位
  document.body.style.overflow = "hidden"; // 弹窗期间锁定背景滚动
  $("#mPrev").disabled = $("#mNext").disabled = modalList.length < 2;
  p.play().catch(() => {});
}

function openModal(card) {
  const it = VMAP.get(card.dataset.v);
  if (!it) return;
  modalList = view; modalIdx = view.indexOf(it);
  showItem(it);
}

function navModal(step) {
  if (!modalList.length) return;
  modalIdx = (modalIdx + step + modalList.length) % modalList.length;
  showItem(modalList[modalIdx]);
}

function closeModal() {
  $("#modal").classList.remove("show");
  document.body.style.overflow = "";
  const p = $("#player"); p.pause(); p.removeAttribute("src"); p.onerror = null; p.load();
}

$("#grid").addEventListener("click", e => { const c = e.target.closest(".vcard"); if (c) openModal(c); });
// 键盘也能打开视频卡片：Tab 聚焦后 Enter / 空格
$("#grid").addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const c = e.target.closest(".vcard");
  if (c) { e.preventDefault(); openModal(c); }
});
$("#mclose").onclick = closeModal;
$("#mPrev").onclick = () => navModal(-1);
$("#mNext").onclick = () => navModal(1);

// 全屏时尽量锁定横屏（Android Chrome 支持；iOS 无此 API，交给系统播放器跟随设备方向）
["fullscreenchange", "webkitfullscreenchange"].forEach(ev => $("#player").addEventListener(ev, () => {
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs && screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(() => {});
}));

// 下载状态机：同一时刻只有一个任务；按钮显式切换“下载视频 / 取消下载”，进度独立成进度条，
// 误触按钮=明确取消而非盲盒；后台下载期间弹窗切到别的视频也不会串数据或误伤
// fetch 成 blob 后触发浏览器保存（Chrome 默认静默存入“下载”文件夹，不弹窗属正常行为）
let curItem = null, dl = null, unloading = false;
window.addEventListener("pagehide", () => { unloading = true; }); // 刷新/关页打断下载时不要当成失败弹新标签
const mdown = $("#mdown"), dlbar = $("#dlbar"), dlfill = $("#dlfill"), dltext = $("#dltext");
const mb = v => (v / 1048576).toFixed(1) + "MB";

// 按“当前弹窗显示的视频”刷新按钮与进度条
function dlUI() {
  if (dl && dl.it === curItem) {
    mdown.textContent = "取消下载";
    mdown.classList.add("canceling");
    mdown.title = "取消当前下载";
    dlbar.hidden = false;
    dlfill.style.width = (dl.pct || 0) + "%";
    dltext.textContent = dl.pct != null ? `${dl.pct}% · ${mb(dl.got)} / ${mb(dl.total)}` : "";
  } else {
    mdown.textContent = "下载视频";
    mdown.classList.remove("canceling");
    mdown.title = "下载视频";
    dlbar.hidden = true;
  }
}

mdown.onclick = async e => {
  e.preventDefault();
  if (!curItem) return;
  // 正在下载当前视频：再次点击 = 明确取消
  if (dl && dl.it === curItem) { dl.aborter.abort(); return; }
  // 别的视频还在后台下载：静默终止并切换到新任务
  if (dl) dl.aborter.abort();
  const it = curItem, aborter = new AbortController(), job = { it, aborter, pct: null, got: 0, total: 0 };
  dl = job;
  dlUI();
  let outcome = "";
  try {
    const r = await fetch(it.video, { signal: aborter.signal });
    if (!r.ok) throw new Error(r.status);
    const total = +(r.headers.get("content-length") || 0);
    let b;
    if (r.body && r.body.getReader && total > 0 && !r.headers.get("content-encoding")) {
      // 边下边显示进度；全部到达内存后写盘是本地操作，所以最后一步“瞬间完成”
      const reader = r.body.getReader(), chunks = [];
      let got = 0, lastPct = -1;
      for (;;) {
        const step = await reader.read();
        if (step.done) break;
        chunks.push(step.value); got += step.value.length;
        const pct = Math.floor(got * 100 / total);
        if (pct !== lastPct) {
          lastPct = pct;
          Object.assign(job, { pct: Math.min(99, pct), got, total });
          if (job === dl && job.it === curItem) dlUI(); // 弹窗还显示这个视频才刷新界面
        }
        // 实测部分 CDN 在字节全部送达后迟迟不发流的结束信号，这里字节到齐即主动收尾，避免卡在 100%
        if (got >= total) { try { reader.cancel(); } catch {} break; }
      }
      b = new Blob(chunks);
    } else {
      b = await r.blob();
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = it.title.replace(/[\\\/:*?"<>|]/g, "_").slice(0, 80) + ".mp4";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    outcome = "saved";
  } catch (err) {
    outcome = err && err.name === "AbortError" ? "canceled" : "failed";
    if (outcome === "failed" && !unloading) window.open(it.video, "_blank");
  }
  // 终态：仅当这个任务仍是当前任务、且弹窗还显示它时才给界面反馈，否则不动新任务的界面
  if (job === dl) {
    dl = null;
    if (job.it === curItem) {
      dlfill.style.width = "100%";
      dltext.textContent = outcome === "saved" ? "已保存到下载文件夹" : outcome === "canceled" ? "已取消" : "下载失败";
      setTimeout(dlUI, outcome === "canceled" ? 1200 : 2000);
    } else dlUI();
  }
};
$("#modal").onclick = e => { if (e.target === $("#modal")) closeModal(); };
document.addEventListener("keydown", e => {
  const modalOpen = $("#modal").classList.contains("show");
  if (e.key === "Escape") {
    if (modalOpen) { closeModal(); return; } // 弹窗开着时 Esc 只负责关弹窗
    if (document.activeElement === qInput) { if (qInput.value) qClear.click(); return; }
    closeModal();
  }
  // 弹窗开着时 ←/→ 切换视频（视频获得焦点时让给原生进度微调）
  if (modalOpen && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    if (/INPUT|TEXTAREA|SELECT|VIDEO/.test((document.activeElement && document.activeElement.tagName) || "")) return;
    navModal(e.key === "ArrowLeft" ? -1 : 1);
  }
  // "/" 聚焦搜索框（弹窗开着时不抢焦点）
  if (e.key === "/" && !modalOpen && !/INPUT|TEXTAREA|SELECT|BUTTON/.test((document.activeElement && document.activeElement.tagName) || "")) { e.preventDefault(); qInput.focus(); }
});
$("#moreBtn").onclick = more;
$("#refresh").onclick = () => load(true);
$("#year").onchange = e => { year = e.target.value; apply(); };
$("#sort").onchange = e => { sort = e.target.value; apply(); };
const qInput = $("#q"), qClear = $("#qclear");
let st;
qInput.addEventListener("input", e => {
  qClear.classList.toggle("show", !!e.target.value);
  clearTimeout(st);
  st = setTimeout(() => { kw = e.target.value.trim(); apply(); }, 130);
});
qClear.onclick = () => {
  qInput.value = ""; kw = "";
  qClear.classList.remove("show");
  qInput.focus();
  apply();
};

// 回到顶部：长列表翻页后快速返回
const toTop = $("#toTop");
window.addEventListener("scroll", () => { toTop.classList.toggle("show", window.scrollY > 600); }, { passive: true });
toTop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

// 滚到底附近自动加载下一页：1300 个视频不该让人点几十次“加载更多”，按钮保留作状态指示
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => {
    if (es.some(x => x.isIntersecting) && shown < view.length) more();
  }, { rootMargin: "600px 0px" });
  io.observe($("#more"));
}

renderDashboard();
setInterval(tickClock, 1000);
setInterval(renderDashboard, 600000);
load(false);
</script>
</body>
</html>
