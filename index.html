<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>米哈游资讯</title>
<link rel="icon" type="image/png" href="assets/icons/HoYoverse.png">
<script>
// 主题在解析 body 前注入，避免 FOUC。hoyo-theme = "dark"|"light"（手动选择）| 无（跟随系统）
// 关键：无论手动还是自动，都必须设置 data-theme，否则全站 CSS 变量失效导致布局散乱
(function () {
  var t = localStorage.getItem("hoyo-theme");
  if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
:root { --ease: cubic-bezier(.22, 1, .36, 1); }
html[data-theme="dark"] {
  color-scheme: dark; --bg: #080a0f; --card: rgba(20, 23, 32, .78); --card-solid: #141720;
  --surface: rgba(255, 255, 255, .04); --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .15);
  --text: #f0f3fa; --text-2: #9ba3b4; --text-3: #636b7e; --track: rgba(255, 255, 255, .09);
  --shadow: 0 12px 36px -12px rgba(0, 0, 0, .65); --shadow-hover: 0 20px 48px -12px rgba(0, 0, 0, .85);
  --urgent: #fb7185; --glow-op: .42;
}
html[data-theme="light"] {
  color-scheme: light; --bg: #f2f4f8; --card: rgba(255, 255, 255, .85); --card-solid: #ffffff;
  --surface: rgba(15, 23, 42, .035); --border: rgba(15, 23, 42, .08); --border-strong: rgba(15, 23, 42, .15);
  --text: #121621; --text-2: #586174; --text-3: #8c95a6; --track: rgba(15, 23, 42, .09);
  --shadow: 0 10px 30px -12px rgba(20, 30, 50, .12); --shadow-hover: 0 20px 44px -12px rgba(20, 30, 50, .2);
  --urgent: #e11d48; --glow-op: .28;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; overflow-x: hidden;
  transition: background .4s var(--ease), color .4s var(--ease);
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
a { color: inherit; text-decoration: none; }

/* 全局细滚动条 */
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); background-clip: content-box; }

/* 背景氛围光晕 */
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(95px); opacity: var(--glow-op); animation: drift 28s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 50vmax; height: 50vmax; left: -16vmax; top: -20vmax; background: radial-gradient(circle, rgba(124, 91, 214, .35), transparent 65%); }
.aurora i:nth-child(2) { width: 45vmax; height: 45vmax; right: -14vmax; top: -6vmax; background: radial-gradient(circle, rgba(217, 161, 44, .28), transparent 65%); animation-delay: -9s; }
.aurora i:nth-child(3) { width: 48vmax; height: 48vmax; left: 25vw; bottom: -24vmax; background: radial-gradient(circle, rgba(239, 122, 69, .24), transparent 65%); animation-delay: -18s; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(3vmax, 2vmax, 0) scale(1.08); } }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 32px) 48px; animation: pageIn .5s var(--ease); }
@keyframes pageIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* 顶栏 */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 200px; }
.logo { width: 40px; height: 40px; border-radius: 12px; flex: none; overflow: hidden; box-shadow: 0 8px 20px -6px rgba(139, 92, 246, .45); }
.logo img { width: 100%; height: 100%; display: block; object-fit: contain; }
.brand h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: .3px; }
.brand p { font-size: .74rem; color: var(--text-3); letter-spacing: .08em; margin-top: 1px; }

.search { position: relative; flex: 1; max-width: 280px; min-width: 180px; }
.search input {
  width: 100%; height: 38px; padding: 0 30px 0 34px; border: 1px solid var(--border-strong); border-radius: 10px;
  background: var(--card); color: var(--text); font-size: .84rem; outline: none; backdrop-filter: blur(12px); transition: border-color .2s;
}
.search input:focus { border-color: var(--text-2); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text-3); }
.qclear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px;
  border: none; border-radius: 50%; background: var(--surface); color: var(--text-3); font-size: .68rem;
  cursor: pointer; display: none; align-items: center; justify-content: center; transition: all .15s;
}
.qclear.show { display: flex; }
.qclear:hover { color: var(--text); background: var(--border-strong); }

.icon-btn, .mclose {
  border: 1px solid var(--border-strong); background: var(--card); color: var(--text-2); cursor: pointer;
  display: grid; place-items: center; transition: all .2s var(--ease);
}
.icon-btn { width: 38px; height: 38px; flex: none; border-radius: 10px; backdrop-filter: blur(12px); }
.icon-btn:hover, .mclose:hover { color: var(--text); border-color: var(--text-2); }
.icon-btn:hover { transform: translateY(-1px); }
.icon-btn:disabled { opacity: .45; cursor: default; transform: none; }
.icon-btn svg { width: 17px; height: 17px; }
html[data-theme="dark"] .ico-sun { display: block; } html[data-theme="dark"] .ico-moon { display: none; }
html[data-theme="light"] .ico-sun { display: none; } html[data-theme="light"] .ico-moon { display: block; }

/* 焦点时间轴看板 */
.hero {
  position: relative; overflow: hidden; border: 1px solid var(--border); background: var(--card);
  border-radius: 22px; padding: clamp(18px, 2.8vw, 26px) clamp(20px, 3.6vw, 32px);
  box-shadow: var(--shadow); backdrop-filter: blur(20px); margin-bottom: 32px;
}
.hero::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(80% 140% at 0% 0%, color-mix(in srgb, var(--g, #8b5cf6) 14%, transparent), transparent 70%);
  pointer-events: none;
}
.hero-head { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.hero-label { font-size: .92rem; font-weight: 800; letter-spacing: .02em; }
.hero-label b { color: var(--g); }
.hero-count { font-size: .74rem; color: var(--text-3); }

.timeline { position: relative; height: 140px; padding: 0 6px; }
.tl-track { position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: var(--border-strong); border-radius: 1px; }
.tl-track::before, .tl-track::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); transform: translateY(-50%); }
.tl-track::before { left: -4px; } .tl-track::after { right: -4px; }
.tl-node { position: absolute; top: 50%; transform: translate(-50%, -50%); z-index: 2; }
.tl-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--gc); box-shadow: 0 0 0 3px var(--card-solid), 0 0 10px var(--gc); }
.tl-tag {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; text-align: center;
  background: var(--card-solid); border: 1px solid var(--border-strong); border-radius: 7px; padding: 4px 8px;
  box-shadow: var(--shadow);
}
.tl-node.above .tl-tag { bottom: 16px; }
.tl-node.below .tl-tag { top: 16px; }
.tl-g { display: block; font-size: .72rem; font-weight: 800; color: var(--gc); line-height: 1.2; }
.tl-t { display: block; font-size: .65rem; color: var(--text-2); margin-top: 1px; }
.tl-scale { position: absolute; left: 6px; right: 6px; bottom: 0; height: 14px; }
.tl-scale span { position: absolute; transform: translateX(-50%); font-size: .63rem; color: var(--text-3); letter-spacing: .04em; white-space: nowrap; }
.tl-scale span:first-child { transform: none; }
.tl-scale span:last-child { transform: translateX(-100%); }
.tl-node.edge-l .tl-tag { transform: none; left: -6px; }
.tl-node.edge-r .tl-tag { transform: translateX(-100%); left: auto; right: -6px; }

.sec { margin-bottom: 36px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-head h2 { font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.sec-head h2::before { content: ""; width: 3.5px; height: 15px; border-radius: 2px; background: linear-gradient(180deg, #8b5cf6, #ec4899); }

/* 四款游戏版本卡片 */
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1060px) { .cards { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 580px) { .cards { grid-template-columns: 1fr; } }

.card {
  position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); backdrop-filter: blur(16px);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease);
}
.card:hover { transform: translateY(-5px); box-shadow: var(--shadow-hover); border-color: color-mix(in srgb, var(--g) 45%, transparent); }
.card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--g), var(--g2)); }
.card.is-urgent { border-color: color-mix(in srgb, var(--urgent) 40%, transparent); }
.card.is-urgent::before { background: var(--urgent); }

.card-top { padding: 18px 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.g-title { display: flex; align-items: center; gap: 8px; font-size: 1rem; font-weight: 800; }
.g-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); box-shadow: 0 0 8px var(--g); }
.cur-pill { font-size: .72rem; font-weight: 700; color: var(--g); background: color-mix(in srgb, var(--g) 13%, transparent); padding: 2px 9px; border-radius: 999px; }

.card-hero { padding: 18px 18px 14px; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--g) 11%, transparent), transparent 72%); }
.target-row { font-size: .76rem; color: var(--text-2); margin-bottom: 6px; }
.target-row b { color: var(--g); font-weight: 800; }
.cd-big { display: flex; align-items: baseline; gap: 5px; }
.cd-big strong { font-size: 2.65rem; font-weight: 800; line-height: 1; letter-spacing: -1.5px; color: var(--text); }
.is-urgent .cd-big strong { color: var(--urgent); }
.cd-big span { font-size: .86rem; font-weight: 700; color: var(--text-2); }

.card-tl { padding: 0 18px 16px; }
.tl-head { display: flex; justify-content: space-between; font-size: .72rem; color: var(--text-3); margin-bottom: 6px; }
.tl-head b { color: var(--text-2); font-weight: 600; }
.bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--g2), var(--g)); transition: width .8s var(--ease); }
.is-urgent .bar i { background: linear-gradient(90deg, var(--g), var(--urgent)); }
.tl-dates { display: flex; justify-content: space-between; margin-top: 6px; font-size: .71rem; color: var(--text-3); }
.tl-dates .end { color: var(--text-2); font-weight: 600; }

.card-meta { margin: auto 18px 14px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 7px; }
.meta-row { display: flex; align-items: center; justify-content: space-between; font-size: .77rem; gap: 8px; }
.meta-row .k { color: var(--text-2); flex: none; }
.meta-row .v { font-weight: 650; color: var(--text); text-align: right; }
.meta-row .v.done { color: var(--text-3); text-decoration: line-through; font-weight: 500; }
.meta-row .v.up { color: var(--g); }
.meta-row .v.mute { color: var(--text-3); font-weight: 500; }

.card-foot { padding: 11px 18px; border-top: 1px solid var(--border); font-size: .78rem; font-weight: 650; color: var(--text-2); text-align: right; }
.card-foot a:hover { color: var(--g); }

/* 官方视频库 */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab {
  padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
  color: var(--text-2); font-size: .78rem; font-weight: 600; cursor: pointer; user-select: none; transition: all .18s;
}
.tab:hover { color: var(--text); border-color: var(--border-strong); }
.tab.on { color: #fff; border-color: transparent; background: var(--tc, #5b6373); }
.tab em { font-style: normal; opacity: .78; margin-left: 4px; font-size: .7rem; }
select { padding: 5px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: .78rem; cursor: pointer; outline: none; }
.note-bar { font-size: .74rem; color: var(--text-3); margin-bottom: 14px; }
.note-bar b { color: var(--text); }

.status { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: .85rem; }
.spin { width: 26px; height: 26px; margin: 0 auto 10px; border: 2.5px solid var(--border-strong); border-top-color: #8b5cf6; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 16px; }
.vcard {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
  transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
}
.vcard:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--g) 65%, transparent); box-shadow: var(--shadow-hover); }
.thumb { position: relative; aspect-ratio: 16/9; background: #07090e; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s var(--ease); }
.vcard:hover .thumb img { transform: scale(1.05); }
.thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(transparent 55%, rgba(0, 0, 0, .5)); }

.play-wrap { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.play-btn {
  position: relative; width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0, 0, 0, .55); color: #fff;
  border: 1.5px solid rgba(255, 255, 255, .32);
  transform: scale(1); transform-origin: center center;
  transition: background-color .22s var(--ease), transform .22s var(--ease), box-shadow .22s var(--ease), border-color .22s var(--ease);
}
.play-btn svg { width: 18px; height: 18px; display: block; transform: translateX(1.5px); }
.play-btn::after {
  content: ""; position: absolute; inset: -1.5px; border-radius: 50%;
  border: 2px solid var(--g); opacity: 0; pointer-events: none;
}
.vcard:hover .play-btn {
  background: var(--g); border-color: transparent; transform: scale(1.14);
  box-shadow: 0 6px 22px color-mix(in srgb, var(--g) 55%, transparent);
}
.vcard:hover .play-btn::after { animation: ripple .7s var(--ease); }
@keyframes ripple { 0% { opacity: .65; transform: scale(1); } 100% { opacity: 0; transform: scale(1.65); } }

.vtag-badge { position: absolute; top: 8px; padding: 2px 8px; border-radius: 999px; font-size: .68rem; font-weight: 700; color: #fff; z-index: 3; }
.vtag-badge.g { left: 8px; background: var(--g); }
.vtag-badge.c { right: 8px; background: rgba(0, 0, 0, .62); backdrop-filter: blur(4px); }

.vmeta { padding: 12px 14px 13px; display: flex; flex-direction: column; flex: 1; }
.vmeta .t { font-size: .85rem; font-weight: 700; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vmeta .b {
  margin-top: 6px; font-size: .74rem; color: var(--text-2); line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.vmeta .d { margin-top: auto; padding-top: 8px; font-size: .71rem; color: var(--text-3); }

.more { display: flex; justify-content: center; margin-top: 22px; }
.more button {
  padding: 9px 24px; border-radius: 10px; color: var(--text); font-size: .82rem; font-weight: 650;
  background: var(--card); border: 1px solid var(--border-strong); cursor: pointer; font-family: inherit;
}
.more button:hover { border-color: var(--text-2); background: var(--surface); }
.empty { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text-3); }

/* 视频播放弹窗与简介排版 */
.modal { position: fixed; inset: 0; z-index: 99; background: rgba(0, 0, 0, .88); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.show { display: flex; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.mbox {
  width: 100%; max-width: 960px; max-height: calc(100vh - 40px);
  background: var(--card-solid); border: 1px solid var(--border-strong); border-radius: 18px;
  overflow: hidden; box-shadow: 0 24px 64px rgba(0, 0, 0, .7); display: flex; flex-direction: column;
}
.mbox video { width: 100%; display: block; max-height: 56vh; background: #000; flex: none; }
.mbody { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.mhead { display: flex; align-items: flex-start; gap: 12px; }
.mhead .info { flex: 1; min-width: 0; }
.mhead .mt { font-size: 1rem; font-weight: 800; line-height: 1.4; }
.mhead .ms { font-size: .76rem; color: var(--text-3); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.mhead .ms b { color: var(--g); font-weight: 700; }
.mactions { display: flex; align-items: center; gap: 8px; flex: none; }
.mbtn { padding: 7px 14px; border-radius: 9px; font-size: .78rem; font-weight: 650; color: #fff; background: #5b6373; white-space: nowrap; transition: filter .2s; }
.mbtn:hover { filter: brightness(1.08); }
.mclose { width: 34px; height: 34px; flex: none; border-radius: 9px; font-size: 1rem; }

.mdesc-box {
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--border);
  overflow-y: auto; max-height: 185px;
}
.mdesc-box::-webkit-scrollbar { width: 5px; }
.mdesc-box::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 999px; }
.mdesc { font-size: .82rem; color: var(--text-2); line-height: 1.8; white-space: pre-wrap; word-break: break-word; }

/* 手机适配 */
@media (max-width: 580px) {
  .wrap { padding: 16px 12px 36px; }
  .brand h1 { font-size: 1.08rem; }
  .logo, .icon-btn { width: 34px; height: 34px; }
  .search { order: 5; max-width: none; width: 100%; flex-basis: 100%; }
  .hero { padding: 16px; border-radius: 16px; }
  .timeline { height: 132px; }
  .tl-tag { padding: 3px 6px; }
  .tl-g { font-size: .68rem; }
  .tl-t { font-size: .62rem; }
  .vgrid { grid-template-columns: 1fr; }
  .modal { padding: 10px; }
  .mbox { border-radius: 14px; }
  .mbox video { max-height: 38vh; }
  .mbody { padding: 13px 14px 14px; gap: 10px; }
  .mhead { flex-wrap: wrap; }
  .mhead .info { flex-basis: 100%; }
  .mactions { width: 100%; }
  .mbtn { flex: 1; text-align: center; }
  .mdesc-box { max-height: 140px; padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>

<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><img src="assets/icons/HoYoverse.png" alt=""></div>
      <div>
        <h1>米哈游资讯</h1>
        <p>崩坏3 · 原神 · 星穹铁道 · 绝区零</p>
      </div>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="搜索标题或视频简介…" autocomplete="off">
      <button class="qclear" id="qclear" title="清空搜索">✕</button>
    </div>
    <button class="icon-btn" id="refresh" title="重新拉取全量官方视频">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="切换深浅色主题">

<script>
"use strict";
const DAY = 86400000, KEY = "hoyo-pv-v12", LIMIT = 24, PAGE_MAX = 300;

const $ = s => document.querySelector(s);
const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const at = (d, t = "06:00") => new Date(`${d}T${t}:00+08:00`);
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const fmtFull = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtShort = d => `${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const bump = v => { const [a, b] = v.split(".").map(Number); return b < 9 ? `${a}.${b + 1}` : `${a + 1}.0`; };
const first = v => !v ? "" : typeof v === "string" ? (v.startsWith("http") ? v : "") : Array.isArray(v) ? first(v[0]) : typeof v === "object" ? first(v.url) : "";
const parse = s => { if (!s || typeof s === "object") return s || {}; try { return JSON.parse(s); } catch { return {}; } };

// 主题：localStorage["hoyo-theme"] = "dark"|"light"（手动）| 无（跟随系统）
// 手动时恢复上次选择，否则跟随系统；两种情况都无条件 applyTheme，保证 data-theme 存在
const mqLight = window.matchMedia("(prefers-color-scheme: light)");
const applyTheme = t => document.documentElement.setAttribute("data-theme", t);
const syncTheme = () => {
  const s = localStorage.getItem("hoyo-theme");
  applyTheme(s === "dark" || s === "light" ? s : mqLight.matches ? "light" : "dark");
};
syncTheme();
if (mqLight.addEventListener) mqLight.addEventListener("change", syncTheme);
else mqLight.addListener(syncTheme);
window.addEventListener("pageshow", syncTheme);
$("#themeBtn").onclick = () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";

};

function getTimeline(g) {
  const now = new Date();
  let start = at(g.start, g.updateTime), cur = g.cur;
  let nextDt = at(g.nextDate, g.updateTime), next = g.next, guard = 0;
  while (nextDt <= now && guard++ < 100) {
    start = nextDt; cur = next;
    nextDt = addDays(nextDt, g.cycle); next = bump(next);
  }
  const pvDt = g.pvKind === "live" ? at(fmtFull(addDays(nextDt, -g.pvOffset)), g.pvTime) : null;
  return { cur, start, next, nextDt, pvDt };
}

function renderDashboard() {
  const now = new Date(), today0 = new Date(); today0.setHours(0, 0, 0, 0);
  const states = GAMES.map(g => ({ g, tl: getTimeline(g) }));

  // 收集未来节点（前瞻 + 更新），按时间排序
  const nodes = [];
  states.forEach(({ g, tl }) => {
    if (tl.pvDt && tl.pvDt > now) nodes.push({ g, type: "preview", dt: tl.pvDt, ver: tl.next });
    if (tl.nextDt > now) nodes.push({ g, type: "update", dt: tl.nextDt, ver: tl.next });
  });
  nodes.sort((a, b) => a.dt - b.dt);

  // 时间轴跨度：至少 30 天，向上取整到 7 的倍数
  const maxDt = nodes.length ? nodes[nodes.length - 1].dt : addDays(now, 30);
  const span = Math.max(30, Math.ceil((maxDt - now) / DAY / 7) * 7);
  const rangeEnd = addDays(now, span);

  const hero = $("#hero");
  if (nodes.length) {
    hero.style.setProperty("--g", nodes[0].g.color);
    hero.innerHTML = `
      <div class="hero-head">
        <span class="hero-label">未来 <b>${span}</b> 天 · 版本节点时间轴</span>
        <span class="hero-count num">${nodes.length} 个节点 · 最近：${nodes[0].g.name} ${fmtShort(nodes[0].dt)}</span>
      </div>
      <div class="timeline">
        <div class="tl-track"></div>
        ${nodes.map((n, i) => {
          const pct = Math.min(100, Math.max(0, (n.dt - now) / (rangeEnd - now) * 100));
          const days = Math.max(0, Math.ceil((n.dt - now) / DAY));
          const edge = pct < 8 ? " edge-l" : pct > 92 ? " edge-r" : "";
          return `<div class="tl-node ${i % 2 ? "below" : "above"}${edge}" style="left:${pct}%;--gc:${n.g.color}" title="${n.g.name} ${n.type === "update" ? "v" + n.ver + " 更新" : "前瞻"} · ${fmtFull(n.dt)}">
            <div class="tl-dot"></div>
            <div class="tl-tag">
              <span class="tl-g">${n.g.name}</span>
              <span class="tl-t">${n.type === "update" ? "更新" : "前瞻"} · ${days}天</span>
            </div>
          </div>`;
        }).join("")}
        <div class="tl-scale num">
          ${Array.from({ length: Math.floor(span / 7) + 1 }, (_, k) => {
            const pct = k * 7 / span * 100;
            return `<span style="left:${pct}%">${fmtShort(addDays(now, k * 7))}</span>`;
          }).join("")}
        </div>
      </div>`;
  } else {
    hero.innerHTML = `<div class="hero-head"><span class="hero-label">暂无近期版本节点</span></div>`;
  }

  $("#cards").innerHTML = states.map(({ g, tl }) => {
    const totalDays = Math.max(1, Math.round((tl.nextDt - tl.start) / DAY));
    const elapsedDays = Math.max(0, Math.floor((now - tl.start) / DAY));
    const remainDays = Math.max(0, Math.ceil((tl.nextDt - now) / DAY));
    const pct = Math.max(0, Math.min(100, Math.round((elapsedDays / totalDays) * 100)));
    const isUrgent = remainDays > 0 && remainDays <= 7;

    let pvHtml = `<span class="v mute">不定期</span>`;
    if (g.pvKind === "live" && tl.pvDt) {
      const diffD = Math.round((new Date(tl.pvDt.getFullYear(), tl.pvDt.getMonth(), tl.pvDt.getDate()) - today0) / DAY);
      pvHtml = tl.pvDt < now ? `<span class="v done">${fmtShort(tl.pvDt)} 已结束</span>`
        : diffD === 0 ? `<span class="v up">今晚 ${g.pvTime}</span>`
        : `<span class="v up">${fmtShort(tl.pvDt)}（${diffD}天后）</span>`;
    }

    return `
      <article class="card ${isUrgent ? "is-urgent" : ""}" style="--g:${g.color};--g2:${g.color2}">
        <div class="card-top">
          <div class="g-title"><span class="g-dot"></span><span>${g.name}</span></div>
          <span class="cur-pill num">当前 v${tl.cur}</span>
        </div>
        <div class="card-hero">
          <div class="target-row">距离 <b>v${tl.next}</b> 更新还有</div>
          <div class="cd-big num">
            <strong>${remainDays}</strong><span>${remainDays > 0 ? "天" : "已更新"}</span>
          </div>
        </div>
        <div class="card-tl">
          <div class="tl-head"><span>版本进度 <b class="num">${pct}%</b></span><span class="num">${elapsedDays} / ${totalDays} 天</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
          <div class="tl-dates num"><span>起 ${fmtShort(tl.start)}</span><span class="end">止 ${fmtShort(tl.nextDt)}</span></div>
        </div>
        <div class="card-meta">
          <div class="meta-row"><span class="k">前瞻直播</span>${pvHtml}</div>
          <div class="meta-row"><span class="k">v${tl.next} 上线</span><span class="v num">${fmtFull(tl.nextDt)} ${WK[tl.nextDt.getDay()]}</span></div>
        </div>
        <div class="card-foot">
          <a href="${g.notice}" target="_blank" rel="noopener">查看版本公告 →</a>
        </div>
      </article>`;
  }).join("");
}

function classify(s, g) {
  s = s || "";
  if (g === "hsr" && s.includes("走近星穹")) return "角色演示";
  if (/前瞻特别节目|版本前瞻|前瞻直播|前瞻预告|版本预告|直播回顾/.test(s) || (/前瞻/.test(s) && !/走近星穹/.test(s))) return "前瞻";
  if (/过场动画|过场短片|CG\b/i.test(s)) return "过场动画";
  if (/剧情\s*PV|剧情短片|剧情预告|千星纪游\s*PV|星旅纪行/i.test(s)) return "剧情PV";
  if (s.includes("动画短片")) return "动画短片";
  if (/版本\s*PV/i.test(s)) return "版本PV";
  if (/角色演示|角色预告|角色展示/.test(s)) return "角色演示";
  if (/角色\s*PV/i.test(s)) return "角色PV";
  if (/(?:^|[^A-Za-z])EP(?![A-Za-z])/i.test(s)) return "EP";
  if (/(?:^|[^A-Za-z])MV|主题曲|印象曲|OP\b|角色曲/i.test(s)) return "音乐";
  return "其他";
}

function cover(ext, vid, g) {
  const c = g === "gi" ? first(ext["720_1"])
    : g === "hsr" ? (first(ext["news-poster"]) || first(ext["news-pic"]))
    : (first(ext["video-cover"]) || first(ext["video-inner-cover"]));
  return c || vid.poster || "";
}

function parseMedia(html, intro, ext) {
  if (!html || !html.includes(".mp4")) return null;
  const doc = new DOMParser().parseFromString(html, "text/html");
  const v = doc.querySelector("video");
  let src = v ? (v.getAttribute("src") || "") : "";
  let poster = v ? (v.getAttribute("poster") || "") : "";
  if (!src.includes(".mp4")) {
    const m = html.match(/<video[^>]+src="([^"]+\.mp4[^"]*)"/i);
    if (!m) return null;
    src = m[1];
    const p = html.match(/poster="([^"]+)"/i);
    poster = p ? p[1] : "";
  }
  src = src.replace(/&amp;/g, "&");
  poster = poster.replace(/&amp;/g, "&");

  doc.querySelectorAll("video, img, script, style").forEach(n => n.remove());
  doc.querySelectorAll("br").forEach(br => br.replaceWith("\n"));
  const blocks = [...doc.querySelectorAll("p, div")].filter(el => !el.querySelector("p, div"));
  const rawLines = (blocks.length ? blocks.map(el => el.textContent) : doc.body.textContent.split(/\n+/))
    .join("\n").split(/\n+/).map(l => l.replace(/\u00a0/g, " ").trim()).filter(Boolean);

  const lines = [];
  for (const t of rawLines) {
    if (/^(?:关于《|——.+——$|▼|关注官方|前往下载)/.test(t)) break;
    lines.push(t);
  }
  const desc = lines.join("\n") || String(intro || ext["news-summary"] || "").trim();
  return { src, poster, desc };
}

const feedUrl = (f, ch, p) => `${f.base}?${f.appId ? `iAppId=${f.appId}&` : ""}iChanId=${ch}&iPageSize=${PAGE_MAX}&iPage=${p}&sLangKey=zh-cn`;

async function fetchPage(f, ch, p) {
  const d = await (await fetch(feedUrl(f, ch, p))).json();
  if (d.retcode !== 0) throw Error(`retcode ${d.retcode}`);
  const out = [];
  for (const it of d.data.list || []) {
    const ext = parse(it.sExt);
    let media = parseMedia(it.sContent, it.sIntro, ext);
    if (!media && ext["video-url"]) {
      const u = first(ext["video-url"]);
      if (u) media = { src: u, poster: "", desc: String(it.sIntro || ext["news-summary"] || "").trim() };
    }
    if (!media || !media.src) continue;
    const title = (it.sTitle || "无标题").trim(), id = it.iInfoId || "";
    out.push({
      game: f.game, title, cat: classify(title, f.game), video: media.src,
      cover: cover(ext, media, f.game), poster: media.poster,
      date: (it.dtStartTime || "").slice(0, 10), link: id ? f.detail + id : "",
      desc: media.desc
    });
  }
  return { items: out, total: d.data.iTotal || 0 };
}

async function limit(tasks, n, onDone) {
  let i = 0, done = 0; const res = new Array(tasks.length);
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, async () => {
    while (i < tasks.length) {
      const k = i++;
      try { res[k] = await tasks[k](); } catch (e) { res[k] = { error: e }; }
      onDone(++done, tasks.length);
    }
  }));
  return res;
}

const normUrl = u => { try { const p = new URL(u); return (p.origin + p.pathname).toLowerCase(); } catch { return String(u || "").split("?")[0].toLowerCase(); } };
function dedupe(a) {
  const seenUrl = new Set(), seenKey = new Set(), o = [];
  for (const x of a) {
    if (!x.video) continue;
    const uKey = normUrl(x.video), tKey = `${x.game}|${x.title.toLowerCase()}|${x.date}`;
    if (seenUrl.has(uKey) || seenKey.has(tKey)) continue;
    seenUrl.add(uKey); seenKey.add(tKey); o.push(x);
  }
  return o.sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : 0);
}

const readCache = () => { try { const o = JSON.parse(localStorage.getItem(KEY) || "null"); return o?.items?.length ? o : null; } catch { return null; } };
const writeCache = a => { try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), items: a })); } catch {} };

let all = [], view = [], shown = 0, game = "all", cat = "all", kw = "", year = "all", sort = "desc", busy = false;
const VMAP = new Map();

function renderLibrary(msg) {
  $("#status").style.display = "none";
  $("#grid").style.display = "grid";
  tabs(); years(); apply();
  if (msg) $("#note").innerHTML = msg;
}

async function load(force) {
  if (busy) return;
  if (!force) {
    const c = readCache();
    if (c) {
      all = dedupe(c.items.map(x => ({ ...x, cat: classify(x.title, x.game) })));
      renderLibrary(`已缓存 <b>${all.length}</b> 个视频 · ${new Date(c.ts).toLocaleString("zh-CN")}`);
      refresh();
      return;
    }
  }
  busy = true; $("#refresh").disabled = true; $("#status").style.display = "block"; $("#grid").style.display = "none"; $("#more").style.display = "none";
  const jobs = FEEDS.flatMap(f => f.chans.map(ch => ({ f, ch })));
  const firstRes = await limit(jobs.map(j => () => fetchPage(j.f, j.ch, 1)), 4, (d, t) => { $("#statusText").textContent = `加载中 ${d}/${t}…`; });
  const counts = firstRes.map(r => Math.max(1, Math.ceil(((r && r.total) || 0) / PAGE_MAX)));
  const extra = []; jobs.forEach((j, i) => { for (let p = 2; p <= counts[i]; p++) extra.push({ ...j, p, i }); });
  const buckets = firstRes.map(r => (r && r.items) || []);
  if (extra.length) await limit(extra.map(j => async () => { const r = await fetchPage(j.f, j.ch, j.p); buckets[j.i].push(...r.items); }), 5, (d, t) => { $("#statusText").textContent = `加载第 ${d}/${t} 页…`; });
  const merged = dedupe(buckets.flat());
  busy = false; $("#refresh").disabled = false;
  if (!merged.length) { $("#statusText").textContent = "未获取到数据，请点右上角重试"; return; }
  all = merged; writeCache(all);
  renderLibrary(`共 <b>${all.length}</b> 个视频`);
}

async function refresh() {
  const rs = await Promise.all(FEEDS.flatMap(f => f.chans.map(ch => fetchPage(f, ch, 1).catch(() => ({ items: [] })))));
  const m = dedupe(all.concat(rs.flatMap(r => r.items)));
  if (m.length !== all.length) {
    const diff = m.length - all.length;
    all = m; writeCache(all);
    renderLibrary(`共 <b>${all.length}</b> 个视频${diff > 0 ? `（新增 ${diff} 个）` : ""}`);
  }
}

function mkTabs(el, items, active, onClick) {
  el.innerHTML = items.map(i => `<div class="tab ${active === i.k ? "on" : ""}" data-k="${i.k}" style="--tc:${i.c || "#5b6373"}">${i.n}<em>${i.m}</em></div>`).join("");
  el.querySelectorAll(".tab").forEach(t => t.onclick = () => { onClick(t.dataset.k); mkTabs(el, items, t.dataset.k, onClick); });
}
function tabs() {
  const gs = GAMES.filter(g => all.some(x => x.game === g.id));
  mkTabs($("#gameTabs"), [{ k: "all", n: "全部", m: all.length, c: "#5b6373" }].concat(gs.map(g => ({ k: g.id, n: g.name, m: all.filter(x => x.game === g.id).length, c: g.color }))),
    game, k => { game = k; cat = "all"; catTabs(); apply(); });
  catTabs();
}
function catTabs() {
  const base = game === "all" ? all : all.filter(x => x.game === game);
  const accent = game === "all" ? "#8b5cf6" : byId[game].color;
  mkTabs($("#catTabs"), CATS.map(c => ({ k: c, n: c, m: base.filter(x => x.cat === c).length, c: accent })),
    cat, k => { cat = cat === k ? "all" : k; apply(); });
}
function years() {
  const y = [...new Set(all.map(x => (x.date || "").slice(0, 4)).filter(Boolean))].sort().reverse();
  $("#year").innerHTML = '<option value="all">全部年份</option>' + y.map(v => `<option value="${v}"${v === year ? " selected" : ""}>${v}</option>`).join("");
}

function apply() {
  let l = game === "all" ? all : all.filter(x => x.game === game);
  if (cat !== "all") l = l.filter(x => x.cat === cat);
  if (year !== "all") l = l.filter(x => (x.date || "").startsWith(year));
  if (kw) {
    const k = kw.toLowerCase();
    l = l.filter(x => x.title.toLowerCase().includes(k) || (x.desc && x.desc.toLowerCase().includes(k)));
  }
  if (sort === "asc") l = [...l].reverse();
  view = l; shown = 0; $("#grid").innerHTML = ""; more();
}

function more() {
  const g = $("#grid");
  if (!view.length) { g.innerHTML = '<div class="empty">没有匹配的视频</div>'; $("#more").style.display = "none"; return; }
  const s = view.slice(shown, shown + LIMIT);
  s.forEach(x => VMAP.set(x.video, x));
  g.insertAdjacentHTML("beforeend", s.map(x => {
    const gm = byId[x.game];
    return `<div class="vcard" style="--g:${gm.color}" data-v="${esc(x.video)}">
      <div class="thumb">
        ${x.cover ? `<img src="${esc(x.cover)}" loading="lazy" alt="">` : ""}
        <span class="vtag-badge g">${esc(gm.name)}</span>
        <span class="vtag-badge c">${esc(x.cat)}</span>
        ${PLAY_ICON}
      </div>
      <div class="vmeta">
        <div class="t">${esc(x.title)}</div>
        ${x.desc ? `<div class="b">${esc(x.desc)}</div>` : ""}
        <div class="d num">${esc(x.date)}</div>
      </div>
    </div>`;
  }).join(""));
  shown += s.length;
  $("#more").style.display = shown < view.length ? "flex" : "none";
  $("#moreBtn").textContent = `加载更多（${shown} / ${view.length}）`;
}

function openModal(card) {
  const it = VMAP.get(card.dataset.v);
  if (!it) return;
  const gm = byId[it.game], p = $("#player");
  $("#mbox").style.setProperty("--g", gm.color);
  p.src = it.video; p.poster = it.poster || "";
  $("#mt").textContent = it.title;
  $("#ms").innerHTML = `<b>${esc(gm.name)}</b><span>·</span><span>${esc(it.cat)}</span><span>·</span><span class="num">${esc(it.date)}</span>`;
  $("#mlink").href = it.link || "#";
  $("#mlink").style.background = gm.color;
  if (it.desc) {
    $("#mdesc").textContent = it.desc;
    $("#mdescBox").style.display = "block";
    $("#mdescBox").scrollTop = 0;
  } else {
    $("#mdescBox").style.display = "none";
  }
  $("#modal").classList.add("show");
  p.play().catch(() => {});
}

function closeModal() {
  $("#modal").classList.remove("show");
  const p = $("#player"); p.pause(); p.removeAttribute("src"); p.load();
}

$("#grid").addEventListener("click", e => { const c = e.target.closest(".vcard"); if (c) openModal(c); });
$("#mclose").onclick = closeModal;
$("#modal").onclick = e => { if (e.target === $("#modal")) closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("#moreBtn").onclick = more;
$("#refresh").onclick = () => load(true);
$("#year").onchange = e => { year = e.target.value; apply(); };
$("#sort").onchange = e => { sort = e.target.value; apply(); };
const qInput = $("#q"), qClear = $("#qclear");
let st;
qInput.addEventListener("input", e => {
  qClear.classList.toggle("show", !!e.target.value);
  clearTimeout(st);
  st = setTimeout(() => { kw = e.target.value.trim(); apply(); }, 130);
});
qClear.onclick = () => {
  qInput.value = ""; kw = "";
  qClear.classList.remove("show");
  qInput.focus();
  apply();
};

renderDashboard();
setInterval(renderDashboard, 600000);
load(false);
</script>
</body>
</html>
