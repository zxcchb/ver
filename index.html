<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏版本更新日历</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1a1d23;
  --sub: #6b7280;
  --line: #e7e9ee;
  --track: #eceef2;
  --shadow: 0 1px 2px rgba(16,24,40,0.04), 0 8px 24px rgba(16,24,40,0.06);
  --shadow-hover: 0 4px 12px rgba(16,24,40,0.08), 0 16px 40px rgba(16,24,40,0.12);
  --urgent: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0c0f;
    --card: #17181d;
    --text: #e7e9ee;
    --sub: #9aa0ab;
    --line: #26282f;
    --track: #26282f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.55);
    --urgent: #f87171;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 48px 20px 64px;
  transition: background 0.2s ease;
}
.container { max-width: 1040px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 36px; }
h1 {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: 0.5px;
  line-height: 1.3;
}
.subtitle {
  color: var(--sub);
  font-size: 0.9rem;
  margin-top: 8px;
  letter-spacing: 0.3px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}
@media (min-width: 720px) {
  .grid { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 719px) and (min-width: 400px) {
  .grid { gap: 16px; }
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--gc-soft);
}
.card-top {
  height: 4px;
  background: linear-gradient(90deg, var(--gc), var(--gc-soft));
}
.card-body {
  padding: 20px 20px 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 8px;
}
.game-name {
  font-size: 0.92rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  line-height: 1.3;
}
.version-label {
  display: block;
  font-size: 0.68rem;
  color: var(--sub);
  margin-top: 3px;
  font-weight: 500;
  letter-spacing: 0.3px;
}
.version-badge {
  font-size: 1.4rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0.5px;
  font-variant-numeric: tabular-nums;
  color: var(--gc);
}
.info {
  display: flex;
  flex-direction: column;
  gap: 9px;
  margin-bottom: 20px;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 0.82rem;
  gap: 12px;
}
.info-row .label { color: var(--sub); font-weight: 500; flex-shrink: 0; }
.info-row .value { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.next-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding-top: 4px;
}
.next-title {
  font-size: 0.7rem;
  color: var(--sub);
  margin-bottom: 7px;
  font-weight: 600;
  letter-spacing: 0.4px;
  text-transform: uppercase;
}
.next-version-line {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.next-version-line .ver {
  font-weight: 800;
  font-size: 1.12rem;
  color: var(--gc);
  font-variant-numeric: tabular-nums;
}
.next-version-line .date {
  font-weight: 600;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
}
.progress-track {
  height: 6px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gc), var(--gc-soft));
  transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.progress-note {
  margin-top: 8px;
  font-size: 0.74rem;
  color: var(--sub);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.countdown-text {
  margin-top: 6px;
  font-size: 0.8rem;
  text-align: right;
  font-weight: 600;
  color: var(--sub);
}
.countdown-text.urgent {
  color: var(--urgent);
  font-weight: 800;
}
.notice-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 14px;
  padding: 8px 0;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--gc);
  text-decoration: none;
  border-top: 1px solid var(--line);
  letter-spacing: 0.3px;
  transition: opacity 0.15s ease;
}
.notice-btn:hover { opacity: 0.75; }
.notice-btn .arrow { font-size: 0.9rem; transition: transform 0.15s ease; }
.notice-btn:hover .arrow { transform: translateX(2px); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>游戏版本更新日历</h1>
    <p class="subtitle">崩坏3 · 原神 · 星穹铁道 · 绝区零</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
const DAY = 24 * 60 * 60 * 1000;
const PREVIEW_LEAD_DAYS = 14; // 前瞻直播通常在版本结束前约 2 周

// 名称 | 当前版本 | 上线日期 | 周期(天) | 有无前瞻 | 主色 | 辅色(用于渐变) | 米游社版本专题页
// 主色/辅色分别适配深色(亮)与浅色(暗)两种模式
const GAMES = [
  { name: "崩坏3",    ver: "9.1", anchor: "2026-09-24", cycle: 63, hasPreview: false,
    notice: "https://www.miyoushe.com/bh3/gameCenter/14",
    color: { light: "#7c5bd6", dark: "#a78bfa", soft: { light: "#a78bfa", dark: "#6d4fc0" } } },
  { name: "原神",     ver: "7.2", anchor: "2026-11-04", cycle: 42, hasPreview: true,
    notice: "https://www.miyoushe.com/ys/gameCenter/3",
    color: { light: "#c78a1e", dark: "#e8b54a", soft: { light: "#e0ad3f", dark: "#b5791a" } } },
  { name: "星穹铁道", ver: "4.7", anchor: "2026-11-11", cycle: 42, hasPreview: true,
    notice: "https://www.miyoushe.com/sr/gameCenter/19",
    color: { light: "#d06a9a", dark: "#f2a6c8", soft: { light: "#e89ac0", dark: "#c25a8a" } } },
  { name: "绝区零",   ver: "3.3", anchor: "2026-10-21", cycle: 42, hasPreview: true,
    notice: "https://www.miyoushe.com/zzz/gameCenter/20",
    color: { light: "#e05a2b", dark: "#f5814d", soft: { light: "#f08a5c", dark: "#cf4f22" } } },
];

function addVersion(ver, n) {
  const [major, minor] = ver.split(".").map(Number);
  const total = major * 10 + (minor || 0) + n;
  return Math.floor(total / 10) + "." + (total % 10);
}

function formatDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function daysUntil(dateStr) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(dateStr + "T00:00:00");
  return Math.round((target - today) / DAY);
}

function render() {
  const grid = document.getElementById("grid");
  const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  grid.innerHTML = "";

  GAMES.forEach(g => {
    const anchorDate = new Date(g.anchor + "T00:00:00");
    const nextDate = new Date(anchorDate.getTime() + g.cycle * DAY);
    const nextVer = addVersion(g.ver, 1);

    // 当前版本已进行天数 / 总周期
    const elapsedDays = -daysUntil(g.anchor);
    const progress = Math.max(0, Math.min(100, Math.round(elapsedDays / g.cycle * 100)));

    const nextDays = daysUntil(formatDate(nextDate));
    const previewDate = new Date(nextDate.getTime() - PREVIEW_LEAD_DAYS * DAY);

    const main = isDark ? g.color.dark : g.color.light;
    const soft = isDark ? g.color.soft.dark : g.color.soft.light;

    let countdownHtml;
    if (nextDays > 0) {
      countdownHtml = `<div class="countdown-text ${nextDays <= 7 ? "urgent" : ""}">距 ${nextVer} 更新还有 ${nextDays} 天</div>`;
    } else {
      countdownHtml = `<div class="countdown-text">${nextVer} 已上线</div>`;
    }

    const previewHtml = g.hasPreview
      ? `<div class="info-row"><span class="label">前瞻直播</span><span class="value">${formatDate(previewDate)}</span></div>`
      : "";

    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--gc", main);
    card.style.setProperty("--gc-soft", soft);
    card.innerHTML = `
      <div class="card-top"></div>
      <div class="card-body">
        <div class="card-head">
          <div>
            <div class="game-name">${g.name}</div>
            <span class="version-label">当前版本</span>
          </div>
          <span class="version-badge">${g.ver}</span>
        </div>
        <div class="info">
          <div class="info-row"><span class="label">上线日期</span><span class="value">${g.anchor}</span></div>
          <div class="info-row"><span class="label">版本周期</span><span class="value">${g.cycle} 天</span></div>
          ${previewHtml}
        </div>
        <div class="next-box">
          <div class="next-title">下一版本</div>
          <div class="next-version-line">
            <span class="ver">${nextVer}</span>
            <span class="date">${formatDate(nextDate)}</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${progress}%"></div>
          </div>
          <div class="progress-note">${g.ver} 已进行 ${elapsedDays} / ${g.cycle} 天</div>
          ${countdownHtml}
        </div>
        <a class="notice-btn" href="${g.notice}" target="_blank" rel="noopener">查看版本公告 <span class="arrow">→</span></a>
      </div>`;
    grid.appendChild(card);
  });
}

render();
</script>
</body>
</html>
